[package]
name = "uanedit-web"
description = "uanedit's web backend and frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["fullstack", "router"] }
serde = { workspace = true }

# Both halves see the domain crate, so server functions take and return its
# types directly — there is no DTO layer. Every type that crosses the wire
# therefore needs `Serialize` and `Deserialize`.
uanedit = { workspace = true }

# The export dialog's archive, built in the browser: `zip` for the container
# and `base64` to hand the bytes to a blob URL, since an eval channel is JSON
# and a byte array would cost four characters a byte. Default features off
# keeps the encrypted and non-deflate codecs out of the bundle.
base64 = { workspace = true }
zip = { version = "8", default-features = false, features = ["deflate"] }

# Syntax highlighting for the export preview. `default-features = false` drops
# the compile-time `code!` macro we have no use for — every file we show is
# generated at runtime — and each `lang-*` pulls one tree-sitter grammar;
# `runtime` comes with them and carries Rust, so the three we render are the
# three we ask for. The grammars are C, which is what `flake.nix` subtracts two
# hardening flags for.
dioxus-code = { version = "0.1", default-features = false, features = [
    "lang-c",
    "lang-xml",
] }

# The filesystem side only, so neither ends up in the browser bundle.
serde_json = { workspace = true, optional = true }
similar = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

# The one timer the browser half needs: debouncing the tree's search box and
# retiring a status message. Already in the tree under `dioxus-web`, so it costs
# the bundle nothing new.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["web"]
# Client half: compiled for wasm32-unknown-unknown by `dx serve`.
web = ["dioxus/web"]
# Server half: compiled natively, and the only side that touches the filesystem.
server = [
    "dioxus/server",
    "uanedit/xml",
    "dep:serde_json",
    "dep:similar",
    "dep:thiserror",
]

[lints]
workspace = true
