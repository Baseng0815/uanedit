[package]
name = "uanedit-web"
description = "uanedit's web backend and frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["fullstack", "router"] }
serde = { workspace = true }

# Both halves see the domain crate, so server functions take and return its
# types directly — there is no DTO layer. Every type that crosses the wire
# therefore needs `Serialize` and `Deserialize`.
uanedit = { workspace = true }

# The filesystem side only, so neither ends up in the browser bundle.
serde_json = { workspace = true, optional = true }
similar = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

# The one timer the browser half needs: debouncing the tree's search box and
# retiring a status message. Already in the tree under `dioxus-web`, so it costs
# the bundle nothing new.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["web"]
# Client half: compiled for wasm32-unknown-unknown by `dx serve`.
web = ["dioxus/web"]
# Server half: compiled natively, and the only side that touches the filesystem.
server = [
    "dioxus/server",
    "uanedit/xml",
    "dep:serde_json",
    "dep:similar",
    "dep:thiserror",
]

[lints]
workspace = true
