[workspace]
members = [
    "uanedit",
    "web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Bastian Engel <bastian.engel00@gmail.com>"]
repository = "https://github.com/bastianengel/uanedit"

[workspace.dependencies]
# Default features off, so the half that compiles to wasm gets the model and the
# edit operations without the XML codec. `uanedit-web`'s `server` feature turns
# `uanedit/xml` back on for the native side that reads and writes files.
uanedit = { path = "uanedit", default-features = false }

# ByteString identifiers and values are base64 in both the XML and the `b=` NodeId form. Small,
# dependency-free, and builds for wasm.
base64 = { version = "0.22", default-features = false, features = ["std"] }
derive_more = { version = "2", features = ["display", "from", "into"] }
# Pinned to the `dx` in the Nix dev shell — dioxus-cli and dioxus must agree.
dioxus = "0.7.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# The NodeSet2 codec. A pull parser and an explicit writer rather than serde
# derives: a UANodeSet round trip has to preserve element order and unknown
# extensions, which a derived model would flatten away.
quick-xml = "0.42"
# Insertion order carries meaning in a nodeset — node order, reference order,
# the alias table — so the model's maps are ordered ones.
indexmap = { version = "2", features = ["serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
ambiguous_negative_literals = "deny"
unit_bindings = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
# A NodeId's namespace index and numeric identifier are u16/u32 on the wire; the
# cast lints keep a silent truncation out of the codec.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
